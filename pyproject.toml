[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url_detect"
version = "0.1.0"
description = "Open-source phishing URL detection engine based on Machine Learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Phishing URL Detector Contributors"}
]
keywords = ["phishing", "detection", "security", "machine-learning", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
    "pydantic==2.6.4",
    "pandas==2.2.1",
    "numpy==1.26.4",
    "scikit-learn==1.4.1.post1",
    "xgboost==2.0.3",
    "joblib==1.3.2",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "prometheus-client==0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==4.1.0",
    "httpx==0.27.0",
    "ruff==0.3.5",
    "black==24.3.0",
    "mypy==1.9.0",
]

ml = [
    "optuna==3.1.1",
    "matplotlib==3.8.3",
    "seaborn==0.13.0",
]

[project.urls]
Homepage = "https://github.com/kepinserius/url_detect"
Documentation = "https://github.com/kepinserius/url_detect#documentation"
Repository = "https://github.com/kepinserius/url_detect.git"
Issues = "https://github.com/kepinserius/url_detect/issues"

[tool.setuptools]
packages = ["api", "inference", "phishing_detector", "training"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", "__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
